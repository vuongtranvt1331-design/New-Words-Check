<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<title>LexicalSpace — Loading...</title>

<style>
:root {
  --bg: #101820;
  --panel: #182b32;
  --green: #a8ff60;
  --cyan: #64f5e5;
  --white: #e8ffe5;
  --muted: #75918b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  overflow: hidden;
  background: var(--bg);
  color: var(--green);
  font-family: "Courier New", monospace;
  image-rendering: pixelated;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    transparent 0px,
    transparent 3px,
    #00000025 4px
  );
  z-index: 5;
}

.screen {
  width: min(100%, 520px);
  padding: 28px 22px;
  border: 3px solid var(--green);
  background: var(--panel);
  box-shadow: 8px 8px 0 #0008, 0 0 35px #a8ff6018;
  text-align: center;
  position: relative;
}

.logo {
  font-size: clamp(25px, 7vw, 39px);
  font-weight: 900;
  letter-spacing: -2px;
  text-shadow: 3px 3px #426c37;
  margin: 0;
}

.subtitle {
  color: var(--cyan);
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 9px;
}

.divider {
  border: 0;
  border-top: 2px dashed #49665b;
  margin: 24px 0;
}

.scene {
  height: 132px;
  position: relative;
  overflow: hidden;
  border-bottom: 4px solid var(--green);
  background:
    linear-gradient(#182b32dd, #182b32dd),
    repeating-linear-gradient(90deg, #254139 0 2px, transparent 2px 16px);
}

.star {
  position: absolute;
  color: var(--white);
  animation: blink 1s steps(2, end) infinite;
}

.star:nth-child(1) { top: 15px; left: 12%; }
.star:nth-child(2) { top: 34px; left: 76%; animation-delay: .4s; }
.star:nth-child(3) { top: 12px; left: 49%; animation-delay: .7s; }

.mountain {
  position: absolute;
  bottom: 0;
  width: 100px;
  height: 64px;
  background: #285448;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.mountain.one { left: 5%; }
.mountain.two {
  left: 52%;
  width: 125px;
  height: 83px;
  background: #203f39;
}

.runner {
  position: absolute;
  bottom: 0;
  left: 8%;
  width: 32px;
  height: 48px;
  animation: run 1.1s steps(8, end) infinite alternate;
}

.runner svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  image-rendering: pixelated;
}

.ground {
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 200%;
  height: 9px;
  background: repeating-linear-gradient(
    90deg, var(--green) 0 12px, transparent 12px 24px
  );
  animation: ground 1s linear infinite;
}

.status {
  margin: 22px 0 12px;
  color: var(--white);
  font-size: 13px;
  min-height: 18px;
}

.bar {
  height: 20px;
  padding: 3px;
  border: 2px solid var(--green);
  background: #0c171b;
}

.fill {
  height: 100%;
  width: 0%;
  background: var(--green);
  box-shadow: 0 0 12px #a8ff6055;
  transition: width .08s linear;
}

.progress-row {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 11px;
  color: var(--cyan);
}

.message {
  margin-top: 25px;
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted);
}

.destination {
  color: var(--white);
  overflow-wrap: anywhere;
}

.blink {
  animation: blink .8s steps(2, end) infinite;
}

.manual {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 14px;
  color: var(--bg);
  background: var(--green);
  font-size: 12px;
  font-weight: bold;
  text-decoration: none;
  border: 2px solid var(--green);
  box-shadow: 4px 4px 0 #0008;
}

.manual:hover,
.manual:focus-visible {
  color: var(--green);
  background: var(--panel);
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

.footer {
  margin-top: 24px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: .25; }
}

@keyframes run {
  from { transform: translateX(0) translateY(0); }
  to { transform: translateX(95px) translateY(-5px); }
}

@keyframes ground {
  from { transform: translateX(0); }
  to { transform: translateX(-24px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 2s !important;
  }
}

@media (max-width: 360px) {
  .screen { padding: 22px 14px; }
  .subtitle { letter-spacing: 1px; }
}
</style>
</head>

<body>
<main class="screen">
  <h1 class="logo">LEXICALSPACE<span class="blink">_</span></h1>
  <div class="subtitle">◆ SYSTEM UPDATE ◆</div>

  <hr class="divider">

  <div class="scene" aria-hidden="true">
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>

    <div class="mountain one"></div>
    <div class="mountain two"></div>

    <div class="runner">
      <svg viewBox="0 0 16 24"
           shape-rendering="crispEdges"
           xmlns="http://www.w3.org/2000/svg">
        <!-- Pixel adventurer -->
        <rect x="5" y="1" width="6" height="6" fill="#a8ff60"/>
        <rect x="4" y="3" width="2" height="2" fill="#e8ffe5"/>
        <rect x="6" y="3" width="1" height="1" fill="#101820"/>
        <rect x="10" y="3" width="1" height="1" fill="#101820"/>
        <rect x="5" y="7" width="6" height="2" fill="#64f5e5"/>
        <rect x="3" y="9" width="10" height="7" fill="#64f5e5"/>
        <rect x="1" y="10" width="3" height="5" fill="#a8ff60"/>
        <rect x="12" y="10" width="3" height="4" fill="#a8ff60"/>
        <rect x="4" y="16" width="3" height="5" fill="#a8ff60"/>
        <rect x="9" y="16" width="3" height="5" fill="#a8ff60"/>
        <rect x="2" y="21" width="5" height="2" fill="#e8ffe5"/>
        <rect x="9" y="21" width="5" height="2" fill="#e8ffe5"/>
      </svg>
    </div>

    <div class="ground"></div>
  </div>

  <div class="status" id="status" aria-live="polite">
    INITIALIZING NEW WORLD...
  </div>

  <div class="bar" role="progressbar"
       aria-label="Redirect progress"
       aria-valuemin="0" aria-valuemax="100"
       aria-valuenow="0" id="progressbar">
    <div class="fill" id="fill"></div>
  </div>

  <div class="progress-row">
    <span id="stage">LOADING ASSETS</span>
    <span id="percent">0%</span>
  </div>

  <div class="message">
    MIGRATING TO NEW SERVER...<br>
    <span class="destination">
      vuongtranvt1331-design.github.io
    </span>
    <br>
    <span class="blink">PLEASE WAIT, PLAYER 1</span>
  </div>

  <a class="manual"
     href="https://vuongtranvt1331-design.github.io/Lexical_Space/">
     ▶ ENTER LEXICALSPACE
  </a>

  <div class="footer">LEXICALSPACE © NEW LEVEL UNLOCKED</div>
</main>

<script>
(() => {
  const destination =
    "https://vuongtranvt1331-design.github.io/Lexical_Space/";

  const fill = document.getElementById("fill");
  const percent = document.getElementById("percent");
  const status = document.getElementById("status");
  const stage = document.getElementById("stage");
  const bar = document.getElementById("progressbar");

  const messages = [
    [0,  "INITIALIZING NEW WORLD...", "LOADING ASSETS"],
    [30, "LOADING PLAYER DATA...", "SYNCING DATA"],
    [60, "UPGRADING YOUR EXPERIENCE...", "UPGRADING"],
    [85, "NEW LEVEL FOUND!", "ALMOST THERE"],
    [100, "READY! ENTERING LEXICALSPACE...", "COMPLETE"]
  ];

  const start = Date.now();
  const duration = 4000;
  let redirected = false;

  function update() {
    if (redirected) return;

    const elapsed = Date.now() - start;
    const progress = Math.min(100, elapsed / duration * 100);
    const value = Math.floor(progress);

    fill.style.width = value + "%";
    percent.textContent = value + "%";
    bar.setAttribute("aria-valuenow", value);

    let current = messages[0];
    for (const message of messages) {
      if (value >= message[0]) current = message;
    }

    status.textContent = current[1];
    stage.textContent = current[2];

    if (progress >= 100) {
      redirected = true;
      status.textContent = "LEVEL COMPLETE! WELCOME BACK!";
      window.location.replace(destination);
      return;
    }

    requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
})();
</script>
</body>
</html>
